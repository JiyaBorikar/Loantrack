<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoanTrack | Loan Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        /* Header */

        header {
            background: #111827;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        .header-subtitle {
            color: #d1d5db;
            font-size: 14px;
        }

        /* Main */

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* Dashboard cards */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        /* Layout */

        .content-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 25px;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        /* Form */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 12px;
            font-size: 14px;
        }

        /* Table */

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .refresh-btn {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #f3f4f6;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        /* Status */

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
        }

        /* Responsive */

        @media (max-width: 850px) {

            .content-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px 20px;
            }

            .header-subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            Loan<span>Track</span>
        </div>

        <div class="header-subtitle">
            Loan Management Dashboard
        </div>

    </header>


    <main>

        <div class="page-title">

            <h1>Loan Dashboard</h1>

            <p>
                Manage and track loan applications
            </p>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total Loans
                </div>

                <div class="stat-value" id="totalLoans">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Pending
                </div>

                <div class="stat-value" id="pendingLoans">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Approved
                </div>

                <div class="stat-value" id="approvedLoans">
                    0
                </div>

            </div>

        </div>


        <!-- Main content -->

        <div class="content-grid">


            <!-- Add loan -->

            <div class="card">

                <h2>Add New Loan</h2>

                <form id="loanForm">

                    <div class="form-group">

                        <label for="borrowerName">
                            Borrower Name
                        </label>

                        <input
                            type="text"
                            id="borrowerName"
                            placeholder="Enter borrower name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loanAmount">
                            Loan Amount
                        </label>

                        <input
                            type="number"
                            id="loanAmount"
                            placeholder="Enter loan amount"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="propertyCity">
                            Property City
                        </label>

                        <input
                            type="text"
                            id="propertyCity"
                            placeholder="Enter city"
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="PENDING">
                                PENDING
                            </option>

                            <option value="APPROVED">
                                APPROVED
                            </option>

                            <option value="REJECTED">
                                REJECTED
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Add Loan
                    </button>

                </form>


                <div id="message"></div>

            </div>


            <!-- Loan table -->

            <div class="card">

                <div class="table-header">

                    <h2>Loan Applications</h2>

                    <button
                        class="refresh-btn"
                        onclick="loadLoans()"
                    >
                        ↻ Refresh
                    </button>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Borrower</th>

                                <th>Amount</th>

                                <th>City</th>

                                <th>Status</th>

                                <th>Created</th>

                            </tr>

                        </thead>


                        <tbody id="loanTableBody">

                            <tr>

                                <td
                                    colspan="6"
                                    class="empty-message"
                                >
                                    Loading loans...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>


    <script>

        const API_URL = "";


        // Load loans from backend

        async function loadLoans() {

            const tableBody =
                document.getElementById("loanTableBody");

            try {

                const response =
                    await fetch(`${API_URL}/loans`);

                if (!response.ok) {
                    throw new Error("Failed to load loans");
                }

                const loans =
                    await response.json();


                // Update statistics

                document.getElementById("totalLoans")
                    .textContent = loans.length;

                document.getElementById("pendingLoans")
                    .textContent =
                    loans.filter(
                        loan => loan.status === "PENDING"
                    ).length;

                document.getElementById("approvedLoans")
                    .textContent =
                    loans.filter(
                        loan => loan.status === "APPROVED"
                    ).length;


                tableBody.innerHTML = "";


                if (loans.length === 0) {

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6"
                                class="empty-message">
                                No loan applications found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                loans.forEach(loan => {

                    const row =
                        document.createElement("tr");


                    let statusClass =
                        "status-pending";

                    if (loan.status === "APPROVED") {
                        statusClass = "status-approved";
                    }

                    if (loan.status === "REJECTED") {
                        statusClass = "status-rejected";
                    }


                    row.innerHTML = `

                        <td>${loan.id}</td>

                        <td>
                            <strong>
                                ${loan.borrower_name}
                            </strong>
                        </td>

                        <td>
                            ₹${Number(
                                loan.loan_amount
                            ).toLocaleString("en-IN")}
                        </td>

                        <td>
                            ${loan.property_city || "-"}
                        </td>

                        <td>
                            <span class="status ${statusClass}">
                                ${loan.status}
                            </span>
                        </td>

                        <td>
                            ${loan.created_at || "-"}
                        </td>

                    `;


                    tableBody.appendChild(row);

                });


            } catch (error) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="empty-message">
                            Unable to connect to backend.
                        </td>
                    </tr>
                `;

                console.error(error);

            }

        }


        // Add a new loan

        document
            .getElementById("loanForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const message =
                        document.getElementById("message");


                    const loan = {

                        borrower_name:
                            document
                                .getElementById(
                                    "borrowerName"
                                )
                                .value,

                        loan_amount:
                            parseFloat(
                                document
                                    .getElementById(
                                        "loanAmount"
                                    )
                                    .value
                            ),

                        property_city:
                            document
                                .getElementById(
                                    "propertyCity"
                                )
                                .value,

                        status:
                            document
                                .getElementById(
                                    "status"
                                )
                                .value
                    };


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/loans`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(loan)
                                }
                            );


                        if (!response.ok) {
                            throw new Error(
                                "Failed to create loan"
                            );
                        }


                        message.textContent =
                            "Loan added successfully.";

                        message.style.color =
                            "#16a34a";


                        document
                            .getElementById("loanForm")
                            .reset();


                        loadLoans();


                    } catch (error) {

                        message.textContent =
                            "Failed to add loan.";

                        message.style.color =
                            "#dc2626";

                        console.error(error);

                    }

                }
            );


        // Load loans when page opens

        loadLoans();

    </script>

</body>

</html>
